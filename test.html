<!doctype html>
<meta charset="utf-8">
<title>protect_trans check</title>

<div class="highlight highlight-source-shell notranslate" id="gh">
<pre><span class="pl-c"><span class="pl-c">#</span> Check status</span>
premptictl status</pre>
</div>

<pre id="html" class="language-html">&lt;!-- a tooltip --&gt;
&lt;div&gt;&lt;/div&gt;</pre>

<pre id="go" class="language-go">// start the server
srv.ListenAndServe()</pre>

<pre id="sh">#!/bin/sh
# remove the cache
rm -rf cache</pre>

<!-- GitHub blob view, markup taken from a saved github.com page -->
<textarea id="read-only-cursor-text-area">#!/usr/bin/env bash
# install prempti</textarea>
<div class="react-code-file-contents">
  <div class="react-line-numbers"><div class="react-line-number react-code-text">1</div></div>
  <div class="react-code-lines">
    <div id="LC1" class="react-file-line"><span class="pl-c"><span class="pl-c">#!</span>/usr/bin/env bash</span></div>
    <div id="LC2" class="react-file-line"><span class="pl-c"><span class="pl-c">#</span> install prempti</span></div>
  </div>
</div>
<nav data-testid="breadcrumbs" id="crumbs"><span>falcosecurity</span>/<span>prempti</span></nav>
<span class="PRIVATE_TreeView-item-content-text" id="tree"><span>.cargo</span></span>

<script src="content_scripts/protect_trans.js"></script>
<script>
// the content script processes the page on DOMContentLoaded, so check after load
window.addEventListener('load', async () => {
  const t = (id, sel) => document.querySelector(`#${id} ${sel}`);
  const checks = {
    'github comment translated': t('gh', '.pl-c[translate="yes"]').textContent === '# Check status',
    'github marker protected': t('gh', '.pl-c .pl-c').getAttribute('translate') === 'no',
    'github block still protected': document.querySelector('#gh').getAttribute('translate') === 'no'
      && !document.querySelector('#gh').classList.contains('notranslate'),
    'github code untouched': !t('gh', 'span[translate="yes"]:not(.pl-c)'),
    'html marker': t('html', '[translate="yes"]').textContent.trim() === 'a tooltip -->',
    'go marker': t('go', '[translate="yes"]').textContent.trim() === 'start the server',
    'shell marker': t('sh', '[translate="yes"]').textContent.trim() === 'remove the cache',
    'shebang untouched': document.querySelectorAll('#sh [translate="yes"]').length === 1,
    'code untouched': !t('go', '[translate="yes"]').textContent.includes('ListenAndServe'),
  };
  const no = sel => document.querySelector(sel).getAttribute('translate') === 'no';
  Object.assign(checks, {
    'blob textarea protected': no('#read-only-cursor-text-area'),
    'blob lines protected': no('.react-code-file-contents'),
    'blob shebang protected': no('#LC1 > .pl-c'),
    'blob comment translated': t('LC2', '.pl-c[translate="yes"]').textContent === '# install prempti',
    'breadcrumbs protected': no('#crumbs'),
    'tree item protected': no('#tree'),
  });

  // dynamically added blocks go through the MutationObserver's idle pass
  document.body.insertAdjacentHTML('beforeend',
    '<pre id="dyn" class="language-go">// added later\nrun()</pre>');
  await new Promise(r => setTimeout(r, 300));
  checks['dynamic block'] = t('dyn', '[translate="yes"]').textContent.trim() === 'added later';

  window.failures = Object.entries(checks).filter(([, ok]) => !ok).map(([n]) => n);
  document.title = window.failures.length ? 'FAIL: ' + window.failures.join(', ') : 'PASS';
  document.body.insertAdjacentHTML('beforeend', `<h2>${document.title}</h2>`);
});
</script>
